model:
  name: CustomBertModelModule
  config:
    learning_rate: 1.0e-05
    epsilon: 1.0e-06
data:
  name: BertDataModule
  glue_dataset: sst2
  batch_size: 32
  num_workers: 1
  model_type: bert-base-uncased
  num_splits: None
  truncate: 100
trainer:
  _target_: pytorch_lightning.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 1
  max_epochs: 2
  accelerator: cpu
  devices: 1
  limit_train_batches: 100
  limit_val_batches: 10
  limit_test_batches: 10
  check_val_every_n_epoch: 1
  deterministic: false
