# Datamodule config for QNLI dataset
_target_: datamodules.glue_datamodule.QNLIDataModule
glue_dataset: qnli
batch_size: 128
num_workers: 1

# we set following parameters to null because they will be overriden in the 
# main script, and because it is impossible to interpolate values from the 
# defaults list. 
model_type: null
num_splits: null

# Truncation of the dataset for test purposes (default = null)
truncate: null